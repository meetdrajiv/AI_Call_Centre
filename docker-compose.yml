version: "3.9"

networks:
  officeai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  nginx_certbot:
  nginx_ssl:
  media_data:

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: officeai-postgres
    restart: unless-stopped
    networks:
      - officeai-network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: officeai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d officeai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: officeai-redis
    restart: unless-stopped
    networks:
      - officeai-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    container_name: officeai-chromadb
    restart: unless-stopped
    networks:
      - officeai-network
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: officeai-backend
    restart: unless-stopped
    networks:
      - officeai-network
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/officeai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: officeai-frontend
    restart: unless-stopped
    networks:
      - officeai-network
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://yourdomain.com/api
      NEXT_PUBLIC_WS_URL: wss://yourdomain.com/ws
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: officeai-celery-worker
    restart: unless-stopped
    networks:
      - officeai-network
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/officeai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - ./data:/app/data
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: officeai-celery-beat
    restart: unless-stopped
    networks:
      - officeai-network
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/officeai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - ./data:/app/data
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: officeai-nginx
    restart: unless-stopped
    networks:
      - officeai-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl
      - nginx_certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
